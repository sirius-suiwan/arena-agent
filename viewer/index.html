<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>坦克迷宫 · Arena Agent</title>
  <link rel="stylesheet" href="/viewer/style.css">
  <script type="module" src="/viewer/app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">ARENA AGENT · 经典迷宫对战</p>
        <h1>坦克迷宫</h1>
      </div>
      <span id="mode-label" class="mode-label">实时观战</span>
    </header>

    <section class="controls" aria-label="对局操作">
      <form id="match-form">
        <button type="submit" name="mode" value="human" class="primary">单人对战</button>
        <button type="submit" name="mode" value="local2">双人同屏</button>
        <button type="submit" name="mode" value="local3">三人同屏</button>
        <button type="submit" name="mode" value="bots">Bot 对战</button>
        <label class="seed-control" for="seed">随机种子
          <input id="seed" type="number" min="0" max="4294967295" value="12" required>
        </label>
      </form>
    </section>

    <section class="board" aria-labelledby="battle-title">
      <div class="section-header"><h2 id="battle-title">战场</h2><span id="frame-label">TICK 0</span></div>
      <div id="canvas-wrap" class="canvas-wrap">
        <canvas id="battle" aria-label="坦克迷宫战场">战场画面需要浏览器支持 Canvas。</canvas>
        <div id="empty" class="empty">
          <strong>坦克迷宫</strong>
          <span>选择上方的对战方式开始</span>
        </div>
        <p id="round-notice" class="round-notice" hidden></p>
      </div>
      <div class="score-panel">
        <div id="scoreboard" class="scoreboard" aria-label="选手比分"></div>
        <span id="round-label">第 1 局</span>
      </div>
      <p id="human-help" class="hint control-hint" hidden></p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">等待开局，或打开已有的回放。</p>
    <p id="error" class="error" role="alert" hidden></p>

    <section class="inspection" aria-labelledby="inspection-title">
      <div class="section-header inspection-header">
        <h2 id="inspection-title">观战与复盘</h2>
        <div class="file-actions">
          <button type="button" id="back-live" hidden>返回实时</button>
          <label class="file-label">打开 JSONL 回放
            <input type="file" id="replay-file" accept=".jsonl,application/x-ndjson,text/plain">
          </label>
        </div>
      </div>
      <div id="timeline-panel" class="timeline" hidden>
        <label for="timeline">回放时间轴</label>
        <input id="timeline" type="range" min="0" max="0" value="0" aria-label="按帧查找回放">
        <div class="transport">
          <button id="prev" type="button">上一帧</button>
          <button id="play" type="button">播放</button>
          <button id="next" type="button">下一帧</button>
        </div>
      </div>
      <details class="events" open>
        <summary>对局事件 <span id="event-count">0 条</span></summary>
        <p id="event-hint" class="hint">事件由裁判生成。</p>
        <ol id="event-list" aria-label="对局事件列表"></ol>
      </details>
      <details id="action-details">
        <summary>本帧采纳的选手动作</summary>
        <pre id="frame-actions">开局帧无选手动作。</pre>
      </details>
    </section>
  </main>
</body>
</html>
