<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>坦克动荡 2 · Arena Agent</title>
  <link rel="stylesheet" href="/viewer/style.css">
  <script type="module" src="/viewer/app.js"></script>
</head>
<body>
  <main>
    <header class="toolbar" aria-label="游戏导航">
      <a class="game-link" href="/">‹ 游戏列表</a>
      <button type="button" id="return-menu" hidden>菜单</button>
      <button type="button" id="match-id" class="match-id" hidden>
        <span>对局 ID</span><code id="match-id-value"></code><span id="match-id-copy" aria-live="polite">复制</span>
      </button>
      <button type="button" id="pause" class="pause-button" hidden>暂停</button>
    </header>

    <section id="menu" class="game-menu" aria-labelledby="game-title">
      <h1 id="game-title">坦克动荡 <span>2</span></h1>
      <form id="match-form" class="classic-menu" aria-label="开局">
        <button type="submit" name="mode" value="human">单人玩家 <small>电脑对战</small></button>
        <button type="submit" name="mode" value="local2">双人对战</button>
        <button type="submit" name="mode" value="local3">三人对战</button>
        <button type="submit" id="bot-start" name="mode" value="bots">Bot 对战</button>
      </form>
      <button type="button" id="continue-match" hidden>返回对局</button>
    </section>

    <section id="stage" class="board" aria-label="战场" hidden>
      <div id="canvas-wrap" class="canvas-wrap">
        <canvas id="battle" aria-label="坦克迷宫战场">战场画面需要浏览器支持 Canvas。</canvas>
        <p id="round-notice" class="round-notice" hidden></p>
      </div>
      <div class="score-panel">
        <div id="scoreboard" class="scoreboard" aria-label="选手比分"></div>
      </div>
      <p id="human-help" class="hint control-hint" hidden></p>
    </section>
    <p id="status" class="visually-hidden" role="status" aria-live="polite">等待开局，或打开已有的回放。</p>
    <p id="error" class="error" role="alert" hidden></p>

    <footer class="files" aria-label="回放文件">
      <button type="button" id="back-live" hidden>返回实时</button>
      <label class="file-label">打开回放
        <input type="file" id="replay-file" accept=".jsonl,application/x-ndjson,text/plain">
      </label>
    </footer>
    <details id="details">
      <summary>对局详情</summary>
      <div class="inspection">
        <div class="stats">
          <span id="mode-label">实时观战</span>
          <span id="round-label">第 1 局</span>
          <span id="time-label">对局时间 00:00</span>
          <span id="frame-label">TICK 0</span>
          <label for="seed">随机种子
            <input id="seed" form="match-form" type="number" min="0" max="4294967295" value="12" required>
          </label>
        </div>
        <section class="seat-name-settings" aria-labelledby="seat-names-title">
          <h2 id="seat-names-title">下局坦克名称</h2>
          <p class="hint" id="seat-name-help">留空使用 bot 提供的名字或座位 ID；C 仅用于三人对战。</p>
          <div class="seat-name-inputs" aria-describedby="seat-name-help">
            <label for="seat-name-A">A <input id="seat-name-A" type="text" maxlength="48" placeholder="自动命名" autocomplete="off" dir="auto"></label>
            <label for="seat-name-B">B <input id="seat-name-B" type="text" maxlength="48" placeholder="自动命名" autocomplete="off" dir="auto"></label>
            <label for="seat-name-C">C <input id="seat-name-C" type="text" maxlength="48" placeholder="自动命名" autocomplete="off" dir="auto"></label>
          </div>
        </section>
        <div id="timeline-panel" class="timeline" hidden>
          <label for="timeline">回放时间轴</label>
          <input id="timeline" type="range" min="0" max="0" value="0" aria-label="按帧查找回放">
          <div class="transport">
            <button id="prev" type="button">上一帧</button>
            <button id="next" type="button">下一帧</button>
          </div>
          <div id="kill-panel" class="kill-panel" hidden>
            <p class="hint">击毁标记（点击查看致命弹道）</p>
            <ol id="kill-markers" aria-label="回放中的击毁标记"></ol>
            <p id="kill-status" class="hint" role="status" hidden></p>
          </div>
        </div>
        <section aria-labelledby="events-title">
          <h2 id="events-title">对局事件 <span id="event-count">0 条</span></h2>
          <p id="event-hint" class="hint">事件由裁判生成。</p>
          <ol id="event-list" aria-label="对局事件列表"></ol>
        </section>
        <section aria-labelledby="actions-title">
          <h2 id="actions-title">本帧采纳的选手动作</h2>
          <pre id="frame-actions">开局帧无选手动作。</pre>
        </section>
      </div>
    </details>
  </main>
</body>
</html>
