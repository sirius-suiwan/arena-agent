<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择游戏 · Arena Agent</title>
  <link rel="stylesheet" href="/viewer/lobby.css">
</head>
<body>
  <main>
    <p class="brand">ARENA AGENT</p>
    <h1>选择游戏</h1>
    <div class="games">
      <a class="game playable" href="/tank">
        <div class="art tank-art" aria-hidden="true">
          <svg viewBox="0 0 200 108" width="200" height="108" focusable="false">
            <path d="M21 17H179V91H21Z M76 17V56H47 M76 91V70H119V42H153 M179 68H151" fill="none" stroke="#424242" stroke-width="4"/>
            <g transform="translate(55 36) rotate(25)">
              <path d="M-10-11h19v5h-19zM-10 6h19v5h-19z" fill="#303030"/>
              <path d="M-8-7h16v14H-8z" fill="#e44f45" stroke="#303030" stroke-width="2"/>
              <path d="M1-2h12v4H1z" fill="#e44f45" stroke="#303030" stroke-width="2"/>
              <circle r="4" fill="#ef7a6f" stroke="#303030" stroke-width="2"/>
            </g>
            <g transform="translate(144 82) rotate(202)">
              <path d="M-10-11h19v5h-19zM-10 6h19v5h-19z" fill="#303030"/>
              <path d="M-8-7h16v14H-8z" fill="#7bb658" stroke="#303030" stroke-width="2"/>
              <path d="M1-2h12v4H1z" fill="#7bb658" stroke="#303030" stroke-width="2"/>
              <circle r="4" fill="#a4cb84" stroke="#303030" stroke-width="2"/>
            </g>
            <circle cx="98" cy="48" r="2.5" fill="#303030"/>
          </svg>
        </div>
        <div class="caption"><span><strong>坦克动荡 2</strong><small>单人、同屏对战、Bot 竞技</small></span><span class="enter" aria-hidden="true">→</span></div>
      </a>
      <section class="game upcoming" aria-label="疯狂小人战斗，尚未接入">
        <div class="art future-art" aria-hidden="true">
          <svg viewBox="0 0 200 108" width="200" height="108" fill="none" stroke="#777" stroke-width="4" stroke-linecap="round" focusable="false">
            <path d="M29 83h142 M47 57h30 M124 57h29" stroke="#aaa"/>
            <circle cx="62" cy="27" r="8"/><path d="M61 36l1 12m-10-3 10-6 10 5m-10 4-7 12m7-12 7 12"/>
            <circle cx="139" cy="27" r="8"/><path d="M138 36l1 12m-10-3 10-6 10 5m-10 4-7 12m7-12 7 12"/>
          </svg>
        </div>
        <div class="caption"><span><strong>疯狂小人战斗</strong><small>尚未接入</small></span></div>
      </section>
    </div>
  </main>
</body>
</html>
